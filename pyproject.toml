[project]
name = "fvtools"
version = "1.0"
description = "Collection of scripts that can be usefull when dealing with fvcom at akvaplan-niva"
readme = "README.md"
requires-python = ">=3.12,<3.16"
dependencies = [
    "numpy>=2.0,<2.6",
    "numba>=0.68.0,<0.69",
    "scipy",
    "pandas",
    "xarray",
    "netCDF4",
    "cftime",
    "matplotlib",
    "cmocean",
    "contextily",
    "geopandas",
    "shapely>=2",
    "pyproj>=3.8.0,<4",
    "pyogrio>=0.13",
    "cartopy",
    "Pillow",
    "networkx",
    "requests",
    "utm",
    "progressbar2>=4.5.0",
    "pyshp",
    "pyTMD",
    "seawater",
    "f90nml",
    "chardet",
    "ipython",
    "ipywidgets",
    "pykdtree; python_version < '3.15'",
    "utide>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "jupyterlab",
    "ipympl",
    "OWSLib",
]
# What CI installs on top of the runtime dependencies: `uv sync --no-dev --group test`.
test = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# fvtools is not installed into the uv environment (no build system), so put
# the repository root on sys.path; `uv run pytest` then works like
# `python -m pytest`.
pythonpath = ["."]
# Tests that need the internet (e.g. MET's THREDDS) carry @pytest.mark.network
# and are skipped unless asked for with `-m network`. --strict-markers turns a
# misspelt marker into an error instead of a test that runs anyway.
addopts = "-m 'not network' --strict-markers"
markers = [
    "network: needs internet access (e.g. MET's THREDDS); skipped unless run with -m network",
]
